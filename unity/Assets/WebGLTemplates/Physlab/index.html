<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>html,body{margin:0;height:100%;background:#111}#c{width:100%;height:100%;display:block}</style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    var build = "Build";
    var config = {
      dataUrl: build + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: build + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: build + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "PhysLab",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}"
    };
    var s = document.createElement("script");
    s.src = build + "/{{{ LOADER_FILENAME }}}";
    s.onload = function () {
      createUnityInstance(document.querySelector("#c"), config).then(function (inst) {
        window.addEventListener("message", function (e) {
          var d = e.data;
          if (d && d.source === "physlab-host" && d.type === "init") {
            inst.SendMessage("ModuleRoot", "Init", JSON.stringify(d.config || {}));
          }
        });
        parent.postMessage({ source: "physlab-module", type: "ready" }, "*");
      });
    };
    document.body.appendChild(s);
  </script>
</body>
</html>
